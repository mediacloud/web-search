name: Unit tests

on:
  pull_request:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mcweb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # required settings with no default in mcweb/settings.py -- everything
      # else already has a safe fallback baked in, so doesn't need to be set
      # here (see settings.py's `env = environ.Env(...)` schema)
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/mcweb_test
      REDIS_URL: redis://localhost:6379/1
      SECRET_KEY: ci-test-secret-key
      EARLIEST_AVAILABLE_DATE: "2020-01-01"
      RSS_FETCHER_URL: http://localhost:8001
      RSS_FETCHER_USER: ci-test-user
      RSS_FETCHER_PASS: ci-test-password

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Django unit tests
        working-directory: mcweb
        run: python manage.py test --noinput
